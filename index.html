<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>군 교육 이수 관리 시스템</title>
  <link rel="stylesheet" href="style.css?v=12">
  <!-- Firebase SDK (compat v10) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-functions-compat.js"></script>
  <!-- 카카오 SDK -->
  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js"
          integrity="sha384-TiCUE00h649CAMonG018J2ujOgDKW/kVWlChEuu4jK2vxfAAD0eZxzCKakxg55G4"
          crossorigin="anonymous"></script>
</head>
<body>

  <!-- ===================== 로딩 화면 ===================== -->
  <div id="loadingScreen">
    <div class="loader-ring"></div>
    <p>로딩 중...</p>
  </div>

  <!-- ===================== 로그인 화면 ===================== -->
  <div id="loginScreen" class="hidden">
    <div class="login-wrapper">
      <div class="login-card">

        <div class="login-hero">
          <div class="star-badge">★</div>
          <h1>군 교육 이수<br>관리 시스템</h1>
          <p>필수 온라인 교육 이수 현황을<br>체계적으로 관리하세요</p>
        </div>

        <div class="tab-group">
          <button id="tabEmail" class="tab active" onclick="switchTab('email')">이메일 로그인</button>
          <button id="tabKakao" class="tab" onclick="switchTab('kakao')">카카오 로그인</button>
        </div>

        <!-- 이메일 로그인 패널 -->
        <div id="panelEmail" class="panel">
          <div class="field">
            <label>이메일 주소</label>
            <input type="email" id="authEmail" placeholder="example@gmail.com" autocomplete="email">
          </div>
          <div class="field">
            <label>비밀번호</label>
            <input type="password" id="authPassword" placeholder="6자 이상" autocomplete="current-password"
              onkeydown="if(event.key==='Enter') emailSignIn()">
          </div>
          <button class="btn primary full" onclick="emailSignIn()">로그인</button>
          <button class="btn outline full" onclick="emailSignUp()">계정 만들기</button>
          <button class="btn ghost full" onclick="resetPassword()">비밀번호 찾기</button>
        </div>

        <!-- 카카오 로그인 패널 -->
        <div id="panelKakao" class="panel hidden">
          <p class="social-desc">카카오 계정으로 간편하게 로그인하세요</p>
          <button class="btn kakao full" onclick="kakaoSignIn()">
            <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
              <path fill="rgba(0,0,0,.85)" d="M9 0C4.03 0 0 3.13 0 7c0 2.49 1.56 4.67 3.9 5.93L2.92 17.1a.28.28 0 0 0 .42.31L8.38 14c.2.01.41.02.62.02 4.97 0 9-3.13 9-7S13.97 0 9 0z"/>
            </svg>
            카카오로 로그인
          </button>
        </div>

        <div id="authError" class="auth-msg hidden"></div>

      </div>
    </div>
  </div>

  <!-- ===================== 앱 화면 ===================== -->
  <div id="appScreen" class="hidden">

    <!-- 헤더 -->
    <header>
      <div class="header-inner">
        <div class="brand">
          <span class="brand-star" aria-hidden="true">★</span>
          <span class="brand-text">교육 이수 관리</span>
        </div>
        <div class="user-info">
          <img id="userPhoto" class="user-avatar" src="" alt="프로필 사진">
          <span id="userName" class="user-name"></span>
          <button class="btn-logout" onclick="doSignOut()">로그아웃</button>
        </div>
      </div>
    </header>

    <main>

      <!-- 통계 대시보드 -->
      <section class="stats" aria-label="이수 현황 요약">
        <div class="stat-card">
          <div class="stat-num" id="statTotal">0</div>
          <div class="stat-lbl">전체 교육</div>
        </div>
        <div class="stat-card green">
          <div class="stat-num" id="statDone">0</div>
          <div class="stat-lbl">이수 완료</div>
        </div>
        <div class="stat-card orange">
          <div class="stat-num" id="statPending">0</div>
          <div class="stat-lbl">미이수</div>
        </div>
        <div class="stat-card blue progress-card">
          <div class="stat-lbl">전체 진행률</div>
          <div class="progress-bar" role="progressbar" id="progressBar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <div class="progress-pct" id="progressPct">0%</div>
        </div>
      </section>

      <!-- 컨트롤 바 -->
      <section class="controls">
        <div class="filters" role="group" aria-label="필터">
          <button class="filter active" onclick="setFilter(this,'all')">전체</button>
          <button class="filter" onclick="setFilter(this,'pending')">미이수</button>
          <button class="filter" onclick="setFilter(this,'done')">완료</button>
          <button class="filter" onclick="setFilter(this,'overdue')">기한초과</button>
          <button class="filter" onclick="setFilter(this,'soon')">임박</button>
        </div>
        <button class="btn primary" onclick="openModal()" aria-label="교육 추가">
          + 교육 추가
        </button>
      </section>

      <!-- 교육 목록 -->
      <section id="listSection" aria-label="교육 목록">
        <div id="emptyState" class="empty-state hidden">
          <div class="empty-icon" aria-hidden="true">📋</div>
          <h3>등록된 교육이 없습니다</h3>
          <p>아래 버튼을 눌러 첫 번째 교육 항목을 추가해보세요</p>
          <button class="btn primary" onclick="openModal()">+ 첫 교육 추가하기</button>
        </div>
        <div id="cardContainer" class="card-container" role="list"></div>
      </section>

    </main>
  </div>

  <!-- ===================== 추가/수정 모달 ===================== -->
  <div id="modalOverlay" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2 id="modalTitle">교육 추가</h2>
        <button class="modal-close" onclick="closeModal()" aria-label="닫기">✕</button>
      </div>
      <form id="eduForm" onsubmit="saveEdu(event)" novalidate>
        <div class="field">
          <label for="fTitle">교육 제목 <span class="req" aria-label="필수">*</span></label>
          <input type="text" id="fTitle" placeholder="예: 개인정보보호 교육" maxlength="100" required>
        </div>
        <div class="field">
          <label for="fDesc">설명 <span class="opt">(선택)</span></label>
          <textarea id="fDesc" placeholder="교육 내용이나 메모를 입력하세요" rows="3" maxlength="500"></textarea>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="fStart">수강 시작일 <span class="opt">(선택)</span></label>
            <input type="date" id="fStart">
          </div>
          <div class="field">
            <label for="fDue">마감일 <span class="req" aria-label="필수">*</span></label>
            <input type="date" id="fDue" required>
          </div>
        </div>
        <div class="field-check">
          <input type="checkbox" id="fEnrolled">
          <label for="fEnrolled">수강 신청 완료</label>
        </div>
        <div class="field-check">
          <input type="checkbox" id="fDone">
          <label for="fDone">이수 완료</label>
        </div>
        <div class="field-error hidden" id="formError"></div>
        <div class="modal-actions">
          <button type="button" class="btn outline" onclick="closeModal()">취소</button>
          <button type="submit" class="btn primary" id="saveBtn">저장</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===================== 토스트 알림 ===================== -->
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="firebase.js?v=12"></script>
  <script src="app.js?v=12"></script>
</body>
</html>
