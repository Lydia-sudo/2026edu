<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>군 교육 이수 관리 시스템</title>
  <link rel="stylesheet" href="style.css?v=13">
  <!-- Firebase SDK (compat v10) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <!-- 카카오 SDK -->
  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js"
          integrity="sha384-TiCUE00h649CAMonG018J2ujOgDKW/kVWlChEuu4jK2vxfAAD0eZxzCKakxg55G4"
          crossorigin="anonymous"></script>
</head>
<body>

  <!-- ===================== 로딩 화면 ===================== -->
  <div id="loadingScreen">
    <div class="loader-ring"></div>
    <p>로딩 중...</p>
  </div>

  <!-- ===================== 로그인 화면 ===================== -->
  <div id="loginScreen" class="hidden">
    <div class="ig-login-wrap">
      <div class="ig-login-card">

        <div class="ig-login-logo">
          <div class="ig-login-icon">★</div>
          <h1>필수교육완료</h1>
          <p>필수 온라인 교육 이수 현황 관리</p>
        </div>

        <div class="tab-group">
          <button id="tabEmail" class="tab active" onclick="switchTab('email')">이메일</button>
          <button id="tabKakao" class="tab" onclick="switchTab('kakao')">카카오</button>
        </div>

        <!-- 이메일 로그인 패널 -->
        <div id="panelEmail" class="panel">
          <div class="field">
            <label>이메일 주소</label>
            <input type="email" id="authEmail" placeholder="example@gmail.com" autocomplete="email">
          </div>
          <div class="field">
            <label>비밀번호</label>
            <input type="password" id="authPassword" placeholder="6자 이상" autocomplete="current-password"
              onkeydown="if(event.key==='Enter') emailSignIn()">
          </div>
          <button class="btn primary full" onclick="emailSignIn()">로그인</button>
          <button class="btn outline full" onclick="emailSignUp()">계정 만들기</button>
          <button class="btn ghost full" onclick="resetPassword()">비밀번호 찾기</button>
        </div>

        <!-- 카카오 로그인 패널 -->
        <div id="panelKakao" class="panel hidden">
          <p class="social-desc">카카오 계정으로 간편하게 로그인하세요</p>
          <button class="btn kakao full" onclick="kakaoSignIn()">
            <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
              <path fill="rgba(0,0,0,.85)" d="M9 0C4.03 0 0 3.13 0 7c0 2.49 1.56 4.67 3.9 5.93L2.92 17.1a.28.28 0 0 0 .42.31L8.38 14c.2.01.41.02.62.02 4.97 0 9-3.13 9-7S13.97 0 9 0z"/>
            </svg>
            카카오로 로그인
          </button>
        </div>

        <div id="authError" class="auth-msg hidden"></div>

      </div>
    </div>
  </div>

  <!-- ===================== 앱 화면 ===================== -->

  <div id="appScreen" class="hidden">

    <!-- 인스타그램 스타일 헤더 -->
    <header class="ig-header">
      <span class="ig-logo">필수교육완료</span>
      <div class="ig-header-right">
        <img id="userPhoto" class="ig-avatar-sm" src="" alt="프로필">
        <button class="ig-icon-btn" onclick="doSignOut()" title="로그아웃">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="ig-main">

      <!-- 스토리 스타일 통계 -->
      <section class="ig-stories" aria-label="이수 현황">
        <button class="ig-story" onclick="setFilterStory(this,'all')">
          <div class="story-ring gradient">
            <div class="story-inner"><span id="statTotal">0</span></div>
          </div>
          <span class="story-label">전체</span>
        </button>
        <button class="ig-story" onclick="setFilterStory(this,'done')">
          <div class="story-ring green">
            <div class="story-inner"><span id="statDone">0</span></div>
          </div>
          <span class="story-label">완료</span>
        </button>
        <button class="ig-story" onclick="setFilterStory(this,'pending')">
          <div class="story-ring gray">
            <div class="story-inner"><span id="statPending">0</span></div>
          </div>
          <span class="story-label">미이수</span>
        </button>
        <button class="ig-story" onclick="setFilterStory(this,'overdue')">
          <div class="story-ring red">
            <div class="story-inner"><span id="statOverdue">0</span></div>
          </div>
          <span class="story-label">기한초과</span>
        </button>
        <button class="ig-story" onclick="setFilterStory(this,'soon')">
          <div class="story-ring orange">
            <div class="story-inner"><span id="statSoon">0</span></div>
          </div>
          <span class="story-label">임박</span>
        </button>
      </section>

      <!-- 진행률 바 -->
      <div class="ig-progress-wrap">
        <div class="ig-progress-bar">
          <div class="ig-progress-fill" id="progressFill"></div>
        </div>
        <span class="ig-progress-pct" id="progressPct">0%</span>
      </div>

      <!-- 피드 -->
      <section id="listSection">
        <div id="emptyState" class="ig-empty hidden">
          <div style="font-size:48px">📋</div>
          <p>등록된 교육이 없습니다</p>
          <button class="ig-btn-primary" onclick="openModal()">+ 추가하기</button>
        </div>
        <div id="cardContainer" role="list"></div>
      </section>

    </main>

    <!-- 인스타그램 스타일 하단 네비게이션 -->
    <nav class="ig-bottom-nav">
      <button class="ig-nav-btn active" onclick="setFilterStory(this,'all')" data-filter="all">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span>전체</span>
      </button>
      <button class="ig-nav-btn" onclick="setFilterStory(this,'pending')" data-filter="pending">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span>미이수</span>
      </button>
      <button class="ig-nav-btn add-btn" onclick="openModal()">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <button class="ig-nav-btn" onclick="setFilterStory(this,'done')" data-filter="done">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        <span>완료</span>
      </button>
      <button class="ig-nav-btn" onclick="setFilterStory(this,'overdue')" data-filter="overdue">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span>기한초과</span>
      </button>
    </nav>
  </div>

  <!-- ===================== 추가/수정 모달 ===================== -->
  <div id="modalOverlay" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2 id="modalTitle">교육 추가</h2>
        <button class="modal-close" onclick="closeModal()" aria-label="닫기">✕</button>
      </div>
      <form id="eduForm" onsubmit="saveEdu(event)" novalidate>
        <div class="field">
          <label for="fTitle">교육 제목 <span class="req" aria-label="필수">*</span></label>
          <input type="text" id="fTitle" placeholder="예: 개인정보보호 교육" maxlength="100" required>
        </div>
        <div class="field">
          <label for="fDesc">설명 <span class="opt">(선택)</span></label>
          <textarea id="fDesc" placeholder="교육 내용이나 메모를 입력하세요" rows="3" maxlength="500"></textarea>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="fStart">수강 시작일 <span class="opt">(선택)</span></label>
            <input type="date" id="fStart">
          </div>
          <div class="field">
            <label for="fDue">마감일 <span class="req" aria-label="필수">*</span></label>
            <input type="date" id="fDue" required>
          </div>
        </div>
        <div class="field-check">
          <input type="checkbox" id="fEnrolled">
          <label for="fEnrolled">수강 신청 완료</label>
        </div>
        <div class="field-check">
          <input type="checkbox" id="fDone">
          <label for="fDone">이수 완료</label>
        </div>
        <div class="field-error hidden" id="formError"></div>
        <div class="modal-actions">
          <button type="button" class="btn outline" onclick="closeModal()">취소</button>
          <button type="submit" class="btn primary" id="saveBtn">저장</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===================== 토스트 알림 ===================== -->
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="firebase.js?v=12"></script>
  <script src="app.js?v=13"></script>
</body>
</html>
